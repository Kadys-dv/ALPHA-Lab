name: ALPHA Builders submission
description: Envie um projeto público para revisão estruturada de README.
title: "[ALPHA Builders] README review submission"
labels:
  - submission
body:
  - type: markdown
    attributes:
      value: |
        Esta submissão é pública e voltada ao laboratório educacional ALPHA Builders em Base Sepolia.
        Nunca envie chave privada, seed phrase, e-mail, documento ou outro dado pessoal sensível.
  - type: input
    id: cycle
    attributes:
      label: Cycle ID
      description: Identificador publico gerado pelo site para ligar inicio, submissao e feedback.
      placeholder: alpha-abcdef123456
    validations:
      required: false
  - type: input
    id: repository
    attributes:
      label: Repository
      description: URL HTTPS de um repositório público no GitHub.
      placeholder: https://github.com/usuario/projeto
    validations:
      required: true
  - type: input
    id: evidence
    attributes:
      label: Evidence
      description: URL HTTPS do Pull Request que altera o README, ou do repositório para submissões legadas.
      placeholder: https://github.com/usuario/projeto/pull/123
    validations:
      required: true
  - type: input
    id: wallet
    attributes:
      label: Wallet
      description: Endereço EVM público usado apenas como identificador verificável de testnet.
      placeholder: 0x0000000000000000000000000000000000000000
    validations:
      required: true
  - type: input
    id: nonce
    attributes:
      label: Nonce
      description: Nonce público gerado pelo site para a prova de controle da carteira.
      placeholder: 0x...
    validations:
      required: true
  - type: input
    id: signature
    attributes:
      label: Signature
      description: Assinatura da mensagem de prova. Não é uma transação nem concede permissão.
      placeholder: 0x...
    validations:
      required: true
  - type: input
    id: proof_created_at
    attributes:
      label: Proof Created At
      description: Instante ISO assinado junto com a prova. A validacao automatica aceita ate 15 minutos.
      placeholder: "2026-09-13T12:00:00.000Z"
    validations:
      required: false
  - type: checkboxes
    id: consent
    attributes:
      label: Confirmações
      options:
        - label: O repositório é público e pode ser revisado.
          required: true
        - label: Não incluí chave privada, seed phrase ou dados pessoais sensíveis.
          required: true
