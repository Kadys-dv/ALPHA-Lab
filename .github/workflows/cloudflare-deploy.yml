name: Cloudflare Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy-alpha-builders to confirm production deploy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alpha-builders-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm == 'deploy-alpha-builders' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Assert deploy credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Reproducible install
        run: npm ci --no-audit --no-fund

      - name: Frontend gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Build Workers bundle
        run: npm run build:vinext

      - name: Deploy to Cloudflare Workers
        run: npm run deploy:vinext
