name: Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy-alpha-builders to confirm production deploy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: alpha-builders-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'deploy-alpha-builders' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
      PRODUCTION_URL: https://alpha-builders-web.cskadys.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Assert deploy credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Reproducible install
        run: npm ci --no-audit --no-fund

      - name: Frontend gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Build Workers bundle
        run: npm run build:vinext

      - name: Deploy to Cloudflare Workers
        run: npm run deploy:vinext

      - name: Verify deployed production
        shell: bash
        run: |
          set -euo pipefail

          root="$(curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors "$PRODUCTION_URL/?verify=$GITHUB_SHA")"
          printf '%s' "$root" | grep -Fq 'ALPHA'
          printf '%s' "$root" | grep -Fq 'Base Sepolia'
          printf '%s' "$root" | grep -Fq 'Aprenda construindo.'
          ! printf '%s' "$root" | grep -Fq 'Base Mainnet'
          ! printf '%s' "$root" | grep -Fq 'Comprar ALPHA'
          ! printf '%s' "$root" | grep -Fq 'Swap ALPHA'
          ! printf '%s' "$root" | grep -Fq 'Stake ALPHA'

          matched=false
          for attempt in $(seq 1 20); do
            probe="$PRODUCTION_URL/api/version?verify=$GITHUB_SHA&attempt=$attempt"
            if curl --fail --silent --show-error --header 'Cache-Control: no-cache' "$probe" > /tmp/version.json; then
              deployed_sha="$(node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('/tmp/version.json','utf8'));process.stdout.write(String(v.commit||''))")"
              if [ "$deployed_sha" = "$GITHUB_SHA" ]; then
                echo "Deployment SHA propagated on attempt $attempt: $deployed_sha"
                matched=true
                break
              fi
              echo "Waiting for Cloudflare propagation: expected $GITHUB_SHA, got ${deployed_sha:-missing} (attempt $attempt/20)"
            else
              echo "Version endpoint not ready yet (attempt $attempt/20)"
            fi
            sleep 4
          done

          if [ "$matched" != true ]; then
            echo "Deployment SHA did not propagate within the verification window"
            cat /tmp/version.json || true
            exit 1
          fi

          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors --header 'Cache-Control: no-cache' "$PRODUCTION_URL/api/status?verify=$GITHUB_SHA" > /tmp/status.json

          node <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('/tmp/version.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('/tmp/status.json', 'utf8'));
          const expectedContract = '0xff15343accc4b77479ebe3c4cae32d99d4c60f48';
          const expectedSha = process.env.GITHUB_SHA;

          if (Number(version.chainId) !== 84532) throw new Error(`Unexpected chainId: ${version.chainId}`);
          if (String(version.contract || '').toLowerCase() !== expectedContract) throw new Error(`Unexpected contract: ${version.contract}`);
          if (version.commit !== expectedSha) throw new Error(`Deployment SHA mismatch: expected ${expectedSha}, got ${version.commit}`);
          if (!status || typeof status !== 'object') throw new Error('Invalid /api/status payload');
          if (!status.metrics || typeof status.metrics !== 'object') throw new Error('Missing status.metrics');
          if (!['ok', 'partial', 'unavailable'].includes(status.state)) throw new Error(`Invalid status.state: ${status.state}`);
          if (!status.checkedAt || Number.isNaN(Date.parse(status.checkedAt))) throw new Error('Missing status.checkedAt');
          console.log(`Production verified at ${process.env.PRODUCTION_URL}`);
          console.log(`Deployment commit: ${version.commit}`);
          console.log(`Public status source state: ${status.state}`);
          NODE
