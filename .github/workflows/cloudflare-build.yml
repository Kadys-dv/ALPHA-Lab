name: Cloudflare Build

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/cloudflare-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-workers-build:
    name: Cloudflare Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Build Cloudflare Workers bundle
        run: npm run build:vinext
