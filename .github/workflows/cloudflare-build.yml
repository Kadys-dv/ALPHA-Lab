name: Cloudflare Build

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/cloudflare-build.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/cloudflare-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-workers-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Build Cloudflare Workers bundle
        run: npm run build:vinext
