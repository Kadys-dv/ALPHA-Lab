name: Frontend Smoke

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/frontend-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify public deployment markers
        env:
          PUBLIC_SITE_URL: https://alpha-builders.kadys-v2.chatgpt.site
        run: node scripts/smoke.mjs
