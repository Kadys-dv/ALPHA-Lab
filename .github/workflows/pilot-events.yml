name: ALPHA Pilot Event Labels

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  label:
    if: startsWith(github.event.issue.title, '[ALPHA Pilot]') || startsWith(github.event.issue.title, '[ALPHA Feedback]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isStart = context.payload.issue.title.startsWith('[ALPHA Pilot]');
            const name = isStart ? 'pilot-started' : 'pilot-feedback';
            const description = isStart ? 'Participant started a public pilot cycle' : 'Participant submitted post-review feedback';
            try {
              await github.rest.issues.getLabel({ ...context.repo, name });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({ ...context.repo, name, color: isStart ? '0969da' : '8250df', description });
            }
            const labels = (context.payload.issue.labels || []).map(label => typeof label === 'string' ? label : label.name).filter(Boolean);
            await github.rest.issues.setLabels({ ...context.repo, issue_number: context.payload.issue.number, labels: [...new Set([...labels, name])] });
