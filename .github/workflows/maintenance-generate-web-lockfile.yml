name: Maintenance Generate Web Lockfile

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.issue.title == '[maintenance] generate web lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/version-web-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Generate lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git commit -m "chore: version web dependency lockfile"
          git push origin HEAD:chore/version-web-lockfile
