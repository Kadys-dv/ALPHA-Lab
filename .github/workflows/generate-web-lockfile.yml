name: Generate Web Lockfile

on:
  push:
    branches:
      - chore/version-web-lockfile
    paths:
      - '.github/workflows/generate-web-lockfile.yml'
      - 'web/package.json'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/version-web-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Generate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git commit -m "chore: version web dependency lockfile"
          git push origin HEAD:chore/version-web-lockfile
