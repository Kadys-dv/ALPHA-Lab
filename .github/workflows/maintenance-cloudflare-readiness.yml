name: Maintenance Cloudflare Readiness

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  compatibility:
    if: github.event.issue.title == '[maintenance] cloudflare readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/cloudflare-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install canonical frontend
        run: npm ci --no-audit --no-fund
      - name: Check vinext compatibility
        run: npx --yes vinext@latest check
