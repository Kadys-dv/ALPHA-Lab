name: Maintenance Cloudflare Readiness

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.issue.title == '[maintenance] cloudflare migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/cloudflare-readiness
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install canonical frontend
        run: npm ci --no-audit --no-fund
      - name: Upgrade Vitest for Vite 8 compatibility
        run: npm install -D vitest@4.1.11 --save-exact --no-audit --no-fund
      - name: Initialize vinext for Cloudflare Workers
        run: npx --yes vinext@latest init --skip-check --platform=cloudflare --cdn-cache=workers-cache --data-cache=none --image-optimization=none --no-prerender
      - name: Build with vinext
        run: npm run build:vinext
      - name: Run existing tests
        run: npm test
      - name: Build with Next.js
        run: npm run build
      - name: Commit Cloudflare readiness changes
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "chore: prepare ALPHA Builders for Cloudflare Workers"
          git push origin HEAD:chore/cloudflare-readiness
